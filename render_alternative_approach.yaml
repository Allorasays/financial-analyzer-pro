services:
  # Alternative Deployment - Use Different Build Strategy
  - type: web
    name: financial-analyzer-pro-alternative
    env: python
    plan: free
    buildCommand: |
      python --version
      python -m pip install --upgrade pip
      pip install streamlit==1.28.1 --no-cache-dir
      pip install pandas==2.0.3 --no-cache-dir
      pip install plotly==5.17.0 --no-cache-dir
      pip install yfinance==0.2.18 --no-cache-dir
      pip install numpy==1.24.3 --no-cache-dir
      pip install scipy==1.11.1 --no-cache-dir
      pip install scikit-learn==1.3.0 --no-cache-dir
      pip install requests==2.31.0 --no-cache-dir
      pip install python-dotenv==1.0.0 --no-cache-dir
    startCommand: python -m streamlit run app_render_simple.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.fileWatcherType none
    envVars:
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: false
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false

