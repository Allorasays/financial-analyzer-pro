services:
  # Simple Streamlit App
  - type: web
    name: financial-analyzer-pro-simple
    env: python
    plan: free
    buildCommand: pip install -r requirements_render_enhanced.txt --no-cache-dir
    startCommand: python -m streamlit run app_render_simple.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.fileWatcherType none
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: false
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false

  # Enhanced Streamlit App
  - type: web
    name: financial-analyzer-pro-enhanced
    env: python
    plan: free
    buildCommand: pip install -r requirements_render_enhanced.txt --no-cache-dir
    startCommand: python -m streamlit run app_render_enhanced.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.fileWatcherType none
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: false
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false

  # FastAPI Backend with AI Services
  - type: web
    name: financial-analyzer-pro-backend
    env: python
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt --no-cache-dir
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./financial_analyzer.db
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: SECRET_KEY
        value: your-secret-key-here-change-in-production
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production


