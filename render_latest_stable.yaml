services:
  # Main Financial Analyzer Pro Application - Latest Stable Version
  - type: web
    name: financial-analyzer-pro-latest
    env: python
    plan: starter
    buildCommand: |
      echo "Building Financial Analyzer Pro - Latest Stable Version..."
      pip install --upgrade pip
      pip install -r requirements_latest.txt --no-cache-dir
      echo "Build completed successfully"
    startCommand: streamlit run app_enhanced_stable.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
    envVars:
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_PORT
        value: 8501
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: false
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /
    autoDeploy: true

# Environment Variables (Global)
envVars:
  - key: PYTHON_VERSION
    value: 3.11.0
  - key: STREAMLIT_THEME_BASE
    value: light
  - key: STREAMLIT_THEME_PRIMARY_COLOR
    value: "#667eea"
  - key: STREAMLIT_THEME_BACKGROUND_COLOR
    value: "#ffffff"
  - key: STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR
    value: "#f0f2f6"
  - key: STREAMLIT_THEME_TEXT_COLOR
    value: "#262730"
  - key: CACHE_TTL_REALTIME
    value: 300
  - key: CACHE_TTL_FINANCIAL
    value: 3600
  - key: CACHE_TTL_MARKET
    value: 1800
  - key: MAX_CONCURRENT_REQUESTS
    value: 100
  - key: RATE_LIMIT_PER_MINUTE
    value: 60
  - key: ENABLE_ML_FEATURES
    value: true
  - key: ENABLE_REALTIME_FEATURES
    value: true
  - key: ENABLE_ANALYTICS
    value: true
  - key: LOG_LEVEL
    value: INFO
  - key: ENABLE_MONITORING
    value: true

# Build Configuration
build:
  commands:
    - echo "Building Financial Analyzer Pro - Latest Stable Version..."
    - pip install --upgrade pip
    - pip install -r requirements_latest.txt --no-cache-dir
    - echo "Build completed successfully"

# Health Checks
healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Scaling Configuration
scaling:
  minInstances: 1
  maxInstances: 5
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

# Security Configuration
security:
  enableHTTPS: true
  enableCORS: false
  enableCSRF: true
  allowedOrigins:
    - "https://financial-analyzer-pro-latest.onrender.com"

# Performance Optimization
performance:
  enableCaching: true
  cacheStrategy: "LRU"
  enableCompression: true
  enableMinification: true
  staticFileCaching: true
  apiResponseCaching: true

# Feature Flags
features:
  machineLearning: true
  realTimeData: true
  advancedAnalytics: true
  portfolioManagement: true
  riskAssessment: true
  technicalAnalysis: true
  exportReports: true
  notifications: true
  mobileOptimization: true
  darkMode: true
  apiAccess: true
  webhookSupport: true
